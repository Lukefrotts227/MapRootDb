[package]
name = "maprootdb"
version = "0.1.0"
edition = "2021"
description = "An experimental in-memory DAG database with snapshots and a localhost TCP protocol"
license = "MIT"
repository = "https://github.com/Lukefrotts227/MapRootDb"
readme = "README.md"
keywords = ["graph", "database", "dag", "in-memory"]
categories = ["database-implementations"]

[dependencies]
bincode = "1.3.3"
ctrlc = "3.4"
serde = {version = "1.0.210", features = ["derive"]}
